name: Build Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Android keystore for build
        run: |
          mkdir -p /home/runner/.config/.android
          keytool -genkey -v -keystore /home/runner/.config/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: flutter build apk --release --flavor github --no-tree-shake-icons

      - name: Set release tag
        id: tag
        run: echo "tag=v${{ steps.version.outputs.version_name }}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Find and Rename APK
        run: |
          mkdir -p release
          # Procura por qualquer APK de release gerado dentro da pasta de outputs do projeto
          APK_PATH=$(find build/app/outputs/ -name "*.apk" | grep -i "release" | head -n 1)
          echo "APK encontrado em: $APK_PATH"
          cp "$APK_PATH" "release/musifly-${{ steps.tag.outputs.tag }}.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Musifly ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: release/*.apk
